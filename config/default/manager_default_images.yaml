# This patch inject custom ENV settings to the manager container
# Used to set our default image locations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
        - name: RELATED_IMAGE_SWIFT_PROXY_IMAGE_URL_DEFAULT
          value: quay.io/openstack-k8s-operators/openstack-swift-proxy-server:master-latest
        - name: RELATED_IMAGE_SWIFT_ACCOUNT_IMAGE_URL_DEFAULT
          value: quay.io/openstack-k8s-operators/openstack-swift-account:master-latest
        - name: RELATED_IMAGE_SWIFT_CONTAINER_IMAGE_URL_DEFAULT
          value: quay.io/openstack-k8s-operators/openstack-swift-container:master-latest
        - name: RELATED_IMAGE_SWIFT_OBJECT_IMAGE_URL_DEFAULT
          value: quay.io/openstack-k8s-operators/openstack-swift-object:master-latest
