---
- job:
    name: swift-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    attempts: 1
    required-projects:
      - github.com/openstack-k8s-operators/swift-operator
    irrelevant-files: &common-irrelevant-files
      - .*/*.md
      - ^\..*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
    vars:
      cifmw_kuttl_tests_operator_list:
        - swift

- job:
    name: swift-operator-antelope-tempest
    parent: podified-multinode-edpm-deployment-crc-2comp
    description: |
      Test the old antelope containers with the newer operators.
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_test_operator_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.object_storage.

- job:
    name: swift-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i swift service images for swift-s2i tempest jobs.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      s2i_ci_images:
        - swift/swift-account
        - swift/swift-container
        - swift/swift-object
        - swift/swift-proxy-server

- job:
    name: swift-s2i-tempest
    parent: s2i-test-base
    description: |
      Validate speculatively-built s2i swift images against a live
      OpenStack deployment.
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.object_storage.
        ^tempest.scenario.test_object_storage_basic_ops..*
      # Reenable when tempest >=43.0.0 is avilable, and namely:
      # https://review.opendev.org/c/openstack/tempest/+/937416 (Idcaacfed5e0203760e9cb2911d93700d8cb63cb5)
      # https://review.opendev.org/c/openstack/tempest/+/937782 (Id93acb1b75b3eda11fb770c86459b024640f1515)
      cifmw_test_operator_tempest_expected_failures_list: |
        tempest.api.object_storage.test_container_services.ContainerTest.test_create_container_with_metadata_value
