---
- job:
    name: swift-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    attempts: 1
    required-projects:
      - github.com/openstack-k8s-operators/swift-operator
    irrelevant-files: &common-irrelevant-files
      - .*/*.md
      - ^\..*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
    vars:
      cifmw_kuttl_tests_operator_list:
        - swift

- job:
    name: swift-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i swift service images for swift-s2i tempest jobs.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      s2i_ci_images:
        - swift/swift-account
        - swift/swift-container
        - swift/swift-object
        - swift/swift-proxy-server

- job:
    name: swift-s2i-test
    parent: s2i-test-base
    description: |
      Validate speculatively-built s2i swift images against a live
      OpenStack deployment.
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.object_storage.
        ^tempest.scenario.test_object_storage_basic_ops..*
