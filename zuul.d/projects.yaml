---
# project template to be used locally for operator testing
- project-template:
    name: swift-operator-s2i-testing
    github-check:
      jobs:
        - swift-s2i-content-provider
        - swift-s2i-test:
            dependencies:
              - openstack-k8s-operators-content-provider
              - swift-s2i-content-provider

# project template to be used in the s2i repository
- project-template:
    name: swift-operator-s2i-component-jobs
    github-check:
      jobs:
        - swift-s2i-test:
            vars:
              content_provider_registry_ip: "{{ s2i_content_provider_registry_ip }}"
            files:
              - ^containers/base/
              - ^containers/swift/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke

- project:
    name: openstack-k8s-operators/swift-operator
    templates:
      - swift-operator-s2i-testing
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider
        - swift-operator-kuttl:
            dependencies:
              - openstack-k8s-operators-content-provider
        - swift-operator-antelope-tempest:
            dependencies:
              - openstack-k8s-operators-content-provider
        - swift-s2i-content-provider
        - swift-s2i-test:
            dependencies:
              - openstack-k8s-operators-content-provider
              - swift-s2i-content-provider
